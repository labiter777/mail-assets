<!doctype html><html lang="ko"><meta charset="utf-8"><title>mail-assets</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font:16px/1.7 -apple-system,system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem;color:#222">
<h1>mail-assets</h1>
<p>메일 본문·공개 콘텐츠에 쓰는 <b>정적 이미지 호스트</b>입니다.</p>
<ul>
<li>주소 꼴: <code>/a/&lt;sha12&gt;/&lt;파일명&gt;</code> — <b>내용 주소</b>라 같은 바이트는 같은 주소, 다른 바이트는 다른 주소입니다.</li>
<li>그래서 <b>이미 보낸 메일의 이미지 주소는 덮어쓰이지 않습니다.</b> <code>a/</code> 아래 파일은 지우지 않습니다.</li>
<li>TLS 는 GitHub 가 자동 갱신합니다(443, 사람 손 필요 없음).</li>
<li>목록: <a href="manifest.json">manifest.json</a></li>
<li>올리는 도구: 마케팅 콘솔 저장소 <code>ops/mail_assets_publish.mjs</code></li>
</ul>
</body></html>
